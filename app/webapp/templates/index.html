<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Black Box</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    try {
      var t = localStorage.getItem("blackbox-theme");
      if (t && t !== "mono") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand"><span class="brand-mark"></span> Black Box</div>
      <a class="nav-link active" href="/"><span class="icon" id="icon-grid"></span> Dashboard</a>
      <div class="nav-section-label">Recent incidents</div>
      <div id="sidebar-incidents"></div>
      <div class="sidebar-status">
        <span id="sidebar-status-dot" class="status-dot"></span>
        <span id="sidebar-status-text">checking…</span>
      </div>
      <div id="theme-switcher" class="theme-switcher"></div>
    </nav>

    <main class="main">
      <header class="page-header">
        <h1>Dashboard</h1>
        <div id="status-pill" class="pill pill-unknown">checking…</div>
      </header>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="dash-grid">
        <section class="card">
          <h2><span class="icon" id="icon-cpu"></span> System right now</h2>
          <div class="gauges" id="gauges"></div>
          <div class="sparkline-wrap">
            <div class="sparkline-label">CPU trend</div>
            <svg id="sparkline" viewBox="0 0 300 40" preserveAspectRatio="none"></svg>
          </div>
          <table class="proc-table">
            <thead><tr><th>Process</th><th>CPU%</th><th>Mem%</th></tr></thead>
            <tbody id="proc-rows"></tbody>
          </table>
        </section>

        <section class="card">
          <h2><span class="icon" id="icon-activity"></span> Incidents</h2>
          <p class="hint">Automatic on crash/exception/sustained load, or trigger one yourself:<br />
            <code>echo "reason" &gt; ~/.blackbox/trigger_now</code></p>
          <ul id="incident-list" class="incident-list"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/sidebar.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
