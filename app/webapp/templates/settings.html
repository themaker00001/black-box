<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings · Black Box</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Crect x='7' y='7' width='18' height='18' rx='5' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%234f9dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E" />
  <script>
    try {
      var t = localStorage.getItem("blackbox-theme");
      if (t && t !== "mono") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand"><span class="brand-mark"></span> Black Box</div>
      <a class="nav-link" href="/"><span class="icon" id="icon-grid"></span> Dashboard</a>
      <a class="nav-link active" href="/settings"><span class="icon" id="icon-settings"></span> Settings</a>
      <div class="nav-section-label">Recent incidents</div>
      <div id="sidebar-incidents"></div>
      <div class="sidebar-status">
        <span id="sidebar-status-dot" class="status-dot"></span>
        <span id="sidebar-status-text">checking…</span>
      </div>
      <div id="theme-switcher" class="theme-switcher"></div>
    </nav>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Settings</h1>
          <p class="page-subtitle">Choose what Black Box is allowed to capture. Changes apply immediately — no restart needed.</p>
        </div>
      </header>

      <div class="dash-grid" style="grid-template-columns: 1fr; padding-top: 16px;">
        <section class="card">
          <h2><span class="icon" id="icon-privacy"></span> What gets captured</h2>
          <div class="settings-list" id="settings-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/sidebar.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
